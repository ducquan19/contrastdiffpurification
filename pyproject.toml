[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contrastdiffpure"
version = "0.1.0"
description = "Contrastive-guided diffusion purification (research code, CIFAR-10 experiments)"
requires-python = ">=3.9"
# Runtime dependencies are listed in requirements.txt.

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

# C++/CUDA sources of score_sde's ops (compiled on first use) and the upstream license files
[tool.setuptools.package-data]
"src.models.score_sde.op" = ["*.cpp", "*.cu"]
"*" = ["LICENSE*", "*.md"]
